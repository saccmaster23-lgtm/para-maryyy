<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Una flor para ti</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: #090914;
    color: white;
    font-family: Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 25px 10px;
    overflow-x: hidden;
}

h1 {
    color: #f4a8ca;
    font-weight: normal;
    text-align: center;
    font-size: clamp(25px, 5vw, 38px);
    text-shadow: 0 0 18px #e85a9b;
}

.subtitulo {
    color: #c5b4c5;
    text-align: center;
    font-size: 14px;
}

canvas {
    width: min(900px, 96vw);
    height: auto;
    display: block;
}

#mensaje {
    max-width: 600px;
    width: 90%;
    text-align: center;
    color: #f4cce0;
    font-size: 19px;
    line-height: 1.8;
    white-space: pre-line;
    margin-top: 15px;
    opacity: 0;
    transition: opacity 2s;
}

</style>
</head>

<body>

<h1>Para tí jeje</h1>


<canvas id="canvas" width="900" height="600"></canvas>

<div id="mensaje"></div>

<script>




const imagenFlor = "wow.jpg";


const colorPetalos = "#ff315f";


const colorDetalles = "#ffc0d9";


const velocidad = 0.045;


const cantidadParticulas = 1800;

const tamanoParticulas = 1.5;

//

const texto = `S.`;

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const imagen = new Image();
imagen.src = imagenFlor;

let particulas = [];
let listaFondo = [];

function mezclarColor(original, nuevo, cantidad) {
    return {
        r: original.r * (1 - cantidad) + nuevo.r * cantidad,
        g: original.g * (1 - cantidad) + nuevo.g * cantidad,
        b: original.b * (1 - cantidad) + nuevo.b * cantidad
    };
}

function hexRGB(hex) {
    const valor = hex.replace("#", "");
    return {
        r: parseInt(valor.slice(0, 2), 16),
        g: parseInt(valor.slice(2, 4), 16),
        b: parseInt(valor.slice(4, 6), 16)
    };
}

function crearParticulas() {
    const temporal = document.createElement("canvas");
    const tctx = temporal.getContext("2d");

    temporal.width = canvas.width;
    temporal.height = canvas.height;

    const escala = Math.min(
        canvas.width / imagen.width,
        canvas.height / imagen.height
    );

    const w = imagen.width * escala;
    const h = imagen.height * escala;

    const x = (canvas.width - w) / 2;
    const y = (canvas.height - h) / 2;

    tctx.drawImage(imagen, x, y, w, h);

    const datos = tctx.getImageData(
        0, 0, canvas.width, canvas.height
    ).data;

    const nuevoColor = hexRGB(colorPetalos);
    const detalle = hexRGB(colorDetalles);

    particulas = [];

    for (let py = 0; py < canvas.height; py += 4) {
        for (let px = 0; px < canvas.width; px += 4) {

            const i = (py * canvas.width + px) * 4;

            const r = datos[i];
            const g = datos[i + 1];
            const b = datos[i + 2];
            const a = datos[i + 3];

            if (a < 100) continue;

            
            const esPetalo =
                r > g * 1.15 &&
                r > b * 1.05 &&
                r > 55;

            let color = { r, g, b };

            if (esPetalo) {
                color = mezclarColor(color, nuevoColor, 0.85);
            } else if (r > g * 1.25 && r > 100) {
                color = mezclarColor(color, detalle, 0.45);
            }

            particulas.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,

                destinoX: px,
                destinoY: py,

                r: color.r,
                g: color.g,
                b: color.b,

                tamano: Math.random() * tamanoParticulas + 0.5,

                fase: Math.random() * Math.PI * 2
            });
        }
    }
}

function crearFondo() {
    listaFondo = [];

    for (let i = 0; i < 65; i++) {
        listaFondo.push({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            tamano: Math.random() * 2 + 0.5,
            velocidad: Math.random() * 0.35 + 0.1,
            opacidad: Math.random() * 0.6 + 0.2
        });
    }
}

let tiempo = 0;
let formada = false;

function animar() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    tiempo += 0.016;

    
    listaFondo.forEach(p => {
        p.y -= p.velocidad;

        if (p.y < 0) {
            p.y = canvas.height;
            p.x = Math.random() * canvas.width;
        }

        ctx.beginPath();
        ctx.arc(p.x, p.y, p.tamano, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,180,220,${p.opacidad})`;
        ctx.fill();
    });

    
    particulas.forEach(p => {

        const diferenciaX = p.destinoX - p.x;
        const diferenciaY = p.destinoY - p.y;

        p.x += diferenciaX * velocidad;
        p.y += diferenciaY * velocidad;

        const flotacion = formada
            ? Math.sin(tiempo * 1.5 + p.fase) * 0.7
            : 0;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y + flotacion,
            p.tamano,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = `rgb(
            ${Math.round(p.r)},
            ${Math.round(p.g)},
            ${Math.round(p.b)}
        )`;

        ctx.shadowBlur = 4;
        ctx.shadowColor = `rgb(${p.r},${p.g},${p.b})`;
        ctx.fill();
    });

    ctx.shadowBlur = 0;

    if (!formada && particulas.length > 0) {
        const terminada = particulas.every(p =>
            Math.abs(p.destinoX - p.x) < 1 &&
            Math.abs(p.destinoY - p.y) < 1
        );

        if (terminada) {
            formada = true;
            mostrarMensaje();
        }
    }

    requestAnimationFrame(animar);
}

function mostrarMensaje() {
    setTimeout(() => {
        const elemento = document.getElementById("mensaje");
        elemento.textContent = texto;
        elemento.style.opacity = 1;
    }, 1200);
}

imagen.onload = () => {
    crearParticulas();
    crearFondo();
    animar();
};

imagen.onerror = () => {
    document.getElementById("mensaje").textContent =
        "No se pudo cargar wow.jpg. Revisa que esté junto a index.html.";
    document.getElementById("mensaje").style.opacity = 1;
};

</script>

</body>
</html>
